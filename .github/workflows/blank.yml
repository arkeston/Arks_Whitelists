name: Merge Sing-Box Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'      # Запуск каждые 6 часов
  workflow_dispatch:          # Кнопка ручного запуска в Actions

permissions:
  contents: write             # Разрешаем писать в репозиторий

jobs:
  merge-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Зависимостей нет — этот шаг пропускаем

      - name: Run merge script
        # Убедись, что имя файла точно совпадает с тем, что в репо
        run: python merge.py

      - name: Auto-commit result
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update merged subscriptions [skip ci]"
          branch: main
          file_pattern: merged_sub.txt
