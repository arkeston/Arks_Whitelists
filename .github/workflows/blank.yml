name: Merge Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Если нужны зависимости (requests и т.д.) — раскомментируй:
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: Run merge script
        # УКАЖИ ЗДЕСЬ ТОЧНОЕ ИМЯ ФАЙЛА ИЗ РЕПО
        run: python merge.py

      - name: Auto-commit and push result
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update merged subscriptions [skip ci]"
          branch: main
          file_pattern: merged_sub.txt
