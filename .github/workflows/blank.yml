name: Merge Subscriptions
permissions:
  contents: write
  
on:
  schedule:
    - cron: '0 */6 * * *'  # Запускать каждые 6 часов (настрой под себя)
  workflow_dispatch:     # Позволяет запустить вручную из интерфейса

jobs:
  merge-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Проверь, какая версия нужна твоему скрипту

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Если у скрипта есть зависимости (например, `requests`), создай requirements.txt и раскомментируй:
          # pip install -r requirements.txt

      - name: Run the script
        run: python merge.py

      - name: Commit and push result
        run: |
          git config --global user.email "your-email@example.com"
          git config --global user.name "Your Name"
          git add merged_sub.txt
          git commit -m "Update merged subscriptions"
          git push
